[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
 
[project]
name = "scm-agentic-rag"
version = "0.2.0"
description = "Agentic AI + RAG for automobile supply chain (Pune auto cluster) - portfolio project"
requires-python = ">=3.11"
 
[tool.setuptools.packages.find]
where = ["src"]
 
[tool.pytest.ini_options]
testpaths = ["tests"]